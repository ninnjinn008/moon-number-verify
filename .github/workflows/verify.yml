name: verify
on:
  push:
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4.12.0 で全ファイルを再コンパイル
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: elan と Lean 4.12.0 を入れる
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.12.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - name: すべての Lean ファイルをコンパイル（約 40〜60 分）
        run: bash lean/build_ci.sh build_log_ci.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-build-log
          path: lean/build_log_ci.txt

  formula:
    name: 最終式のハッシュ照合と全文の構文検査
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ハッシュ値の照合（tr_hash_check.py lngn）
        run: python3 tr_hash_check.py lngn
      - name: 全文の構文検査（phi_syntax_check.c）
        run: |
          gcc -O2 -o phi_syntax_check phi_syntax_check.c
          mkfifo phi.fifo
          ( ./phi_syntax_check < phi.fifo > syntax.txt 2>&1; echo "rc=$?" >> syntax.txt ) &
          python3 final_phi.py --stream phi.fifo
          wait
          cat syntax.txt
          grep -q "^rc=0" syntax.txt
          grep -q "^記号数 = 19229718256$" syntax.txt
          grep -q "^自由変数 = {x}$" syntax.txt
